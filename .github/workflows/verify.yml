name: Verify pinned Erdos proofs

on:
  workflow_dispatch:

env:
  PINNED_COMMIT: 8822f7ddef30fadbd92e1c6ab4ed897af356af5e

jobs:
  erdos449:
    name: Erdos449.not_erdos_449
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: src/latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: plby/lean-proofs
          ref: 8822f7ddef30fadbd92e1c6ab4ed897af356af5e

      - name: Install elan
        working-directory: .
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - run: lean --version
      - run: lake exe cache get
      - run: lake build ErdosProblems.Erdos449

      - name: Axiom closure
        run: |
          printf 'import ErdosProblems.Erdos449\n#print axioms Erdos449.not_erdos_449\n' > axioms_449.lean
          lake env lean axioms_449.lean

  erdos446:
    name: Erdos446.erdos_446
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: src/latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: plby/lean-proofs
          ref: 8822f7ddef30fadbd92e1c6ab4ed897af356af5e

      - name: Install elan
        working-directory: .
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - run: lean --version
      - run: lake exe cache get

      # Replicates the `post_update` hook of src/latest/lakefile.lean, which
      # `lake build` does not run. Without it the dependencies do not compile.
      - name: Apply the upstream compatibility patches
        run: |
          set -eu
          apply() {
            pkg=".lake/packages/$1"; patch="patches/$2"
            if git -C "$pkg" apply --check "$PWD/$patch" 2>/dev/null; then
              git -C "$pkg" apply "$PWD/$patch" && echo "applied $2 to $1"
            elif git -C "$pkg" apply --reverse --check "$PWD/$patch" 2>/dev/null; then
              echo "already applied: $2"
            else
              echo "CANNOT APPLY $2 to $1"; exit 1
            fi
          }
          apply BoundedGaps formalpantheon-v4.33.0.patch
          apply BoundedGaps formalpantheon-v4.33.0-s2.patch
          apply BoundedGaps boundedgaps-linter-v4.33.0.patch
          apply AINTLIB     aintlib-v4.33.0.patch
          apply AINTLIB     hasseweil-linter-v4.33.0.patch
          apply AINTLIB     chebotarev-linter-v4.33.0.patch
          apply AINTLIB     dedekind-flt-linter-v4.33.0.patch
          apply leancert    leancert-linter-v4.33.0.patch
          apply Waring      waring-linter-v4.33.0.patch

      - run: lake build ErdosProblems.Erdos446

      - name: Axiom closure
        run: |
          printf 'import ErdosProblems.Erdos446\n#print axioms Erdos446.erdos_446\n' > axioms_446.lean
          lake env lean axioms_446.lean

  bridge449:
    name: Statement bridge for Erdos449
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out this repository
        uses: actions/checkout@v5
        with:
          path: self

      - name: Check out plby/lean-proofs at the pinned commit
        uses: actions/checkout@v5
        with:
          repository: plby/lean-proofs
          ref: 8822f7ddef30fadbd92e1c6ab4ed897af356af5e
          path: upstream

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the pinned proof
        working-directory: upstream/src/latest
        run: |
          lean --version
          lake exe cache get
          lake build ErdosProblems.Erdos449

      - name: Check the statement bridge
        working-directory: upstream/src/latest
        run: |
          cp "$GITHUB_WORKSPACE/self/bridge/Bridge449.lean" .
          lake env lean Bridge449.lean

  comparator449:
    name: Comparator — Erdos449
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: comparator/erdos-449
    steps:
      - uses: actions/checkout@v5

      - name: Install bubblewrap (required by lake comparator)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap jq
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version

      - name: Install elan
        working-directory: .
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch the pinned proof and its challenge
        run: bash fetch.sh

      - run: lean --version
      - run: lake --help | grep -A1 comparator || true

      - name: Resolve dependencies and fetch the Mathlib cache
        run: |
          lake update -R 2>&1 | tail -5
          lake exe cache get

      - name: Build challenge and solution
        run: lake build Deps Challenge ChallengeFC Solution

      - name: Comparator — against the challenge distributed with the proof
        run: |
          set -o pipefail
          lake comparator --config comparator.json 2>&1 | tee comparator-plby.log
          echo "verdict plby : $?"

      - name: Comparator — against the statement of formal-conjectures#5210
        run: |
          set -o pipefail
          lake comparator --config comparator-fc.json 2>&1 | tee comparator-fc.log
          echo "verdict formal-conjectures : $?"

      - name: Comparator — same statement, every bundled external kernel
        continue-on-error: true
        run: |
          set -o pipefail
          lake comparator --config comparator-fc.json --paranoid 2>&1 | tee comparator-fc-paranoid.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparator-449-logs
          path: comparator/erdos-449/*.log
          if-no-files-found: ignore
