name: Verify pinned Erdos proofs

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: src/latest
    steps:
      - name: Check out plby/lean-proofs at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: plby/lean-proofs
          ref: 8822f7ddef30fadbd92e1c6ab4ed897af356af5e

      - name: Install elan
        working-directory: .
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: lean --version

      - name: Fetch the Mathlib cache
        run: lake exe cache get

      - name: Build ErdosProblems.Erdos446
        run: lake build ErdosProblems.Erdos446

      - name: Axiom closure of Erdos446.erdos_446
        run: |
          printf 'import ErdosProblems.Erdos446\n#print axioms Erdos446.erdos_446\n' > axioms_446.lean
          lake env lean axioms_446.lean

      - name: Build ErdosProblems.Erdos449
        run: lake build ErdosProblems.Erdos449

      - name: Axiom closure of Erdos449.not_erdos_449
        run: |
          printf 'import ErdosProblems.Erdos449\n#print axioms Erdos449.not_erdos_449\n' > axioms_449.lean
          lake env lean axioms_449.lean
